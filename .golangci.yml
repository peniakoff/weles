version: "2"

linters:
  # The v2 "standard" set (errcheck, govet, ineffassign, staticcheck, unused)
  # is enabled by default.
  enable:
    - misspell
    - revive
    - unconvert
    - whitespace
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: exported
        - name: package-comments
        - name: var-naming
