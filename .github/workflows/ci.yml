name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so new linters in a release don't fail unrelated PRs; bump deliberately.
          version: v2.15.0

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build server
        run: make build

      - name: Build Lambda (linux/arm64)
        run: make lambda-build

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          # Native installer is digest-verified, unlike an unpinned pip install; bump deliberately.
          version: 1.171.0
          use-installer: true

      - name: Validate SAM template
        run: make sam-validate
